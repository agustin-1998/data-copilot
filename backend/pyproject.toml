[project]
name = "data-copilot"
version = "0.1.0"
description = "Data Copilot backend: core, LangGraph agent, FastAPI and MCP entry points."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
